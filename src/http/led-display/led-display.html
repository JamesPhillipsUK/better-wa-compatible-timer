<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Display</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css" , type="text/css" />
</head>

<body class="bg-black">
  <div class="screen">
    <div id="topLabel" class="top-label">&nbsp;</div>
    <div class="timer-wrap">
      <div id="timer" class="timer">--</div>
    </div>
    <div class="bottom-group">
      <div id="bottomLabel" class="bottom-label">&nbsp;</div>
      <div id="secondary" class="secondary">&nbsp;</div>
    </div>
    <div id="flag" class="flag">TIMER READY</div>
  </div>
  <div id="offlineMessage" class="offline-message">TIMER OFFLINE</div>
  <script src="http://localhost:5001/socket.io/socket.io.js"></script>
  <script src="./script.js"></script>
</body>

</html>
