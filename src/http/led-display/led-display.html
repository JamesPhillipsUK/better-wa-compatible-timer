<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Display</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css" , type="text/css" />
</head>

<body class="bg-black">
  <div class="screen">
    <div id="topLabel" class="top-label">&nbsp;</div>
    <div class="timer-wrap">
      <div id="timer" class="timer">--</div>
    </div>
    <div class="bottom-group">
      <div id="bottomLabel" class="bottom-label">&nbsp;</div>
      <div id="secondary" class="secondary">&nbsp;</div>
    </div>
    <div id="flag" class="flag">TIMER READY</div>
  </div>
  <div id="offlineMessage" class="offline-message">TIMER OFFLINE</div>
  <script>
    (function () {
      const socketLibraryUrl = new URL(
        "http://localhost:5001/socket.io/socket.io.js"
      );
      socketLibraryUrl.hostname = window.location.hostname;

      function loadDisplayScript() {
        const displayScript = document.createElement("script");
        displayScript.src = "./script.js";
        document.body.appendChild(displayScript);
      }

      const socketLibrary = document.createElement("script");
      socketLibrary.src = socketLibraryUrl.href;

      socketLibrary.onload = loadDisplayScript;

      socketLibrary.onerror = function () {
        console.error(
          "Could not load the WA socket library:",
          socketLibraryUrl.href
        );
        loadDisplayScript();
      };

      document.body.appendChild(socketLibrary);
    })();
  </script>
</body>

</html>
